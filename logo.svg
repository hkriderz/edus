<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Metallic gradient background -->
  <defs>
    <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9CA3AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer frame/border -->
  <path d="M20 10 L180 10 L180 50 L160 50 L160 30 L40 30 L40 50 L20 50 Z" 
        stroke="url(#metallicGradient)" 
        stroke-width="3" 
        fill="none"/>
  
  <!-- Diagonal N/M structure -->
  <path d="M40 10 L160 50" 
        stroke="url(#metallicGradient)" 
        stroke-width="4" 
        fill="none"/>
  <path d="M40 50 L160 10" 
        stroke="url(#metallicGradient)" 
        stroke-width="4" 
        fill="none"/>
  
  <!-- Curved swoosh elements -->
  <path d="M25 25 Q35 30 45 35" 
        stroke="url(#metallicGradient)" 
        stroke-width="2" 
        fill="none"/>
  <path d="M25 30 Q35 35 45 40" 
        stroke="url(#metallicGradient)" 
        stroke-width="2" 
        fill="none"/>
  <path d="M25 35 Q35 40 45 45" 
        stroke="url(#metallicGradient)" 
        stroke-width="2" 
        fill="none"/>
  
  <!-- Text -->
  <text x="100" y="15" 
        font-family="Arial, sans-serif" 
        font-size="8" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#metallicGradient)">
    NMWD
  </text>
</svg>





