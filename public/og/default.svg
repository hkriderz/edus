      <stop offset="0" stop-color="#c4603a" stop-opacity="0.38" />
      <stop offset="1" stop-color="#c4603a" stop-opacity="0" />
    </linearGradient>
    <pattern id="rules" width="100" height="630" patternUnits="userSpaceOnUse">
      <rect width="1" height="630" fill="#f7f3ec" opacity="0.07" />
