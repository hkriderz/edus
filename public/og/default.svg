  <rect x="80" y="516" width="1040" height="1" fill="#f7f3ec" opacity="0.18" />

  <text x="80" y="562" fill="#b4aaa0" font-family="ui-monospace, 'Courier New', monospace" font-size="18" letter-spacing="2.5">STUDIO QUALITY � PUBLISHED PRICING � GUARANTEED SUPPORT</text>
