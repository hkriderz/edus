  <text x="156" y="113" fill="#f7f3ec" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" letter-spacing="-0.5">EDUS</text>
  <text x="258" y="112" fill="#8d8378" font-family="ui-monospace, 'Courier New', monospace" font-size="15" letter-spacing="4">DESIGNS</text>

  <text x="80" y="330" fill="#f7f3ec" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="600" letter-spacing="-5">Exceptional</text>
