server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static export emits directory-style URLs; keep the trailing slash so the
    # canonical URLs in the HTML and the served paths agree.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 256;

    # Baseline hardening. CSP is intentionally omitted here: the site inlines
    # GTM and JSON-LD, so a policy belongs in the CDN/edge layer where nonces
    # can be injected per request.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Legacy URLs from the Near Me Web Designs site.
    location = /portfolio/ { return 301 /work/; }
    location = /portfolio  { return 301 /work/; }

    # Content-hashed assets are safe to cache forever.
    # nginx drops parent add_header when a location sets its own, so repeat
    # the security headers here.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # HTML should always be revalidated so deploys take effect immediately.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
